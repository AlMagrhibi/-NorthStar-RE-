[package]
name = "nsre"
version = "0.3.0"
edition = "2021"
rust-version = "1.89"
license = "UNLICENSED"
publish = false

[dependencies]
rayon = "1.10"
walkdir = "2.5"
sha2 = "0.10"
serde_json = "1.0"
rusqlite = { version = "0.43", default-features = false, features = ["bundled", "cache"] }

[profile.release]
lto = "thin"

[workspace]
resolver = "2"

[target."cfg(windows)".dependencies]
png = "0.18"
windows = { version = "0.62.2", default-features = false, features = ["Win32_UI_Accessibility", "Win32_System_Com", "Win32_Foundation"] }
