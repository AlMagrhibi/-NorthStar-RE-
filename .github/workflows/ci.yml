name: NorthStar RE CI
on:
  push:
    branches: [main]
    tags: ['v11.*', 'v12.*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: northstar-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native:
    name: Native (windows-2022)
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Install pinned Rust
        run: rustup toolchain install 1.91.1 --profile minimal --component rustfmt,clippy
      - name: Manifests, references, integrity and Python-free policy
        shell: pwsh
        run: ./scripts/Validate-Package.ps1 -CheckHashes
      - name: Build, tests, Clippy and doctor
        shell: pwsh
        run: ./scripts/Run-Native-Checks.ps1 -Reports "${{ runner.temp }}/native-reports"
      - name: Prepare real Windows engine for lifecycle test
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path skills/northstar-re/engine/bin -Force | Out-Null
          Copy-Item skills/northstar-re/engine/nsre/target/release/nsre.exe skills/northstar-re/engine/bin/nsre.exe
          ./scripts/Write-Checksums.ps1
          ./scripts/Test-Installer.ps1 2>&1 | Tee-Object -FilePath "${{ runner.temp }}/native-reports/installer.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: evidence-windows-2022
          path: ${{ runner.temp }}/native-reports
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: success() && runner.os == 'Windows'
        with:
          name: windows-engine
          path: skills/northstar-re/engine/nsre/target/release/nsre.exe
          if-no-files-found: error
  security:
    name: Security and licenses
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.91.1 --profile minimal
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        id: audit-cache
        with:
          path: ~/.cargo/bin/cargo-audit.exe
          key: windows-cargo-audit-0.23.0-rust-1.91.1
      - if: steps.audit-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-audit --version 0.23.0 --locked
      - name: Audit locked dependencies and licenses
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "${{ runner.temp }}/security" -Force | Out-Null
          cargo audit --file skills/northstar-re/engine/nsre/Cargo.lock --json | Set-Content "${{ runner.temp }}/security/audit.json"
          if ($LASTEXITCODE -ne 0) { throw 'Dependency audit failed' }
          ./scripts/Check-Licenses.ps1 | Set-Content "${{ runner.temp }}/security/licenses.json"
          ./scripts/Write-Sbom.ps1 -Output "${{ runner.temp }}/security/sbom.json"
          ./scripts/Validate-Package.ps1 -CheckHashes
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: security-evidence
          path: ${{ runner.temp }}/security
          if-no-files-found: error
  package:
    name: Verified Windows distributions
    needs: [native, security]
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-engine
          path: skills/northstar-re/engine/nsre/target/release
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: evidence-windows-2022
          path: ${{ runner.temp }}/release-reports
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: security-evidence
          path: ${{ runner.temp }}/release-reports
      - name: Assemble and independently verify both archives
        shell: pwsh
        run: |
          $request=Get-Content .github/release-request.json -Raw | ConvertFrom-Json
          $meta=Get-Content framework.json -Raw | ConvertFrom-Json
          $expected="v$($meta.version)"
          if ($request.tag -ne $expected) { throw "Release request tag '$($request.tag)' does not match the tree generation '$expected'; refusing to publish a stale tag" }
          if ($request.tag -eq 'v11.0.0-rc.2') { throw 'v11.0.0-rc.2 is the historical installation baseline and must never be rebuilt or republished' }
          # Development packages are built and verified as artifacts; they are never published.
          if ($request.channel -eq 'development') {
            Write-Host "Development package for ${expected}: built as artifact only, publication not authorized"
          } elseif (!$request.authorized) {
            throw 'No authorized release request'
          }
          ./install/Package-Release.ps1 -Tag $request.tag -Output "${{ runner.temp }}/release-assets" -Reports "${{ runner.temp }}/release-reports" -Development:($request.channel -eq 'development')
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verified-release-assets
          path: ${{ runner.temp }}/release-assets
          if-no-files-found: error
  publish:
    name: Publish authorized candidate
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v11.') || startsWith(github.ref, 'refs/tags/v12.'))
    needs: [package]
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: verified-release-assets
          path: release-assets
      - name: Create release only after all mandatory gates
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $request=Get-Content .github/release-request.json -Raw | ConvertFrom-Json
          if (!$request.authorized) { throw 'Publication is not authorized by release-request.json' }
          if ($request.channel -eq 'development') { throw 'Development builds are never published' }
          if ($request.tag -notmatch '^v1[12]\.[0-9]+\.[0-9]+-rc\.[0-9]+$') { throw 'No authorized release-candidate tag' }
          $tag=if ($env:GITHUB_REF -like 'refs/tags/*') {$env:GITHUB_REF -replace '^refs/tags/',''} else {$request.tag}
          if ($tag -ne $request.tag) { throw 'Tag not approved by release request' }
          $meta=Get-Content framework.json -Raw | ConvertFrom-Json
          if ($tag -ne "v$($meta.version)") { throw "Requested tag '$tag' does not match the tree generation 'v$($meta.version)'" }
          if ($tag -eq 'v11.0.0-rc.2') { throw 'v11.0.0-rc.2 is the historical baseline; never republish it' }
          gh release view $tag --json tagName 2>$null
          if ($LASTEXITCODE -eq 0) { Write-Host 'Existing release retained; no overwrite'; exit 0 }
          $manifest=Get-Content release-assets/release-manifest.json -Raw | ConvertFrom-Json
          if (!$manifest.required_checks_passed -or $manifest.commit -ne $env:GITHUB_SHA -or $manifest.tag -ne $tag) { throw 'Release evidence mismatch' }
          foreach ($line in Get-Content release-assets/SHA256SUMS.txt) {
            if ($line -notmatch '^([a-f0-9]{64})  ([A-Za-z0-9._-]+)$') { throw 'Invalid checksum entry' }
            $hash=$Matches[1]; $name=$Matches[2]
            if ((Get-FileHash (Join-Path release-assets $name) -Algorithm SHA256).Hash.ToLowerInvariant() -ne $hash) { throw 'Artifact hash mismatch' }
          }
          $assets=@(Get-ChildItem -LiteralPath release-assets -File | ForEach-Object FullName)
          gh release create $tag @assets --target $env:GITHUB_SHA --prerelease --title "NorthStar RE Framework V11 — $tag" --notes-file docs/RELEASE-NOTES-AR.md
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
